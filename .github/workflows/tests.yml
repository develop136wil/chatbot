name: Regression Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/frontend.test.cjs
      - name: Verify DB migrations on isolated PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d chatbot_test -v ON_ERROR_STOP=1 -f tests/database_regression.sql
      - name: Verify multi-session budget concurrency
        env:
          CHATBOT_ISOLATED_DB_TEST: '1'
        run: python tests/database_concurrency.py
