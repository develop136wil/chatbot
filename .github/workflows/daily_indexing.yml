name: Daily Content Indexing

on:
  schedule:
    # 매일 한국 시간 새벽 4시 (UTC 19:00)
    - cron: '0 19 * * *'
  workflow_dispatch: # 수동 실행 가능

# Avoid overlapping runs overwriting indexing metadata or cache retry markers.
concurrency:
  group: daily-content-indexing
  cancel-in-progress: false

jobs:
  run-indexer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt
        python -m pip check

    - name: Run Indexer Script
      env:
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # [수정] 코드와 일치시킴 (Repo Secret 이름을 GEMINI_API_KEYS로 설정 권장)
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SMTP_USER: ${{ secrets.SMTP_USER }}           # [신규] 이메일 알림 계정
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}   # [신규] 이메일 앱 비밀번호
        # VERCEL_ENV 등 필요한 경우 추가
      run: |
        python run_indexer.py

    - name: Surface failure or timeout
      if: failure()
      run: |
        echo "::error title=Daily Content Indexing failed::Check the final summary and failed step. Setup failures/timeouts require GitHub Actions notifications."
        echo "## 인덱싱 실행 실패" >> "$GITHUB_STEP_SUMMARY"
        echo "설치·시간 초과 등 Python 실행 전후의 실패는 GitHub Actions 알림과 실패 단계에서 확인하세요." >> "$GITHUB_STEP_SUMMARY"
