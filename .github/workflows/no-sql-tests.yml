name: Chatbot Regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm ci --ignore-scripts
      - run: node scripts/browser-vendor.cjs --check
      - run: npm audit --audit-level=moderate
      - run: node --test tests/frontend.test.cjs tests/analytics_dashboard.test.cjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: node tests/security.browser.cjs
      - run: node tests/ui_design.browser.cjs

  python-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Separate job: the audit tool never changes the application environment.
      - run: python -m pip install pip-audit==2.10.1
      # All direct/transitive requirements are pinned; do not resolve or install them.
      # Do not use --fix or suppress failures: advisories and lookup failures fail CI.
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip --strict --progress-spinner off --timeout 20

  redis-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify actual Redis Lua, concurrency and expiry
        run: python -m unittest discover -s tests -p 'redis_integration.py' -v
        env:
          CHATBOT_REDIS_INTEGRATION: '1'
          CHATBOT_TEST_REDIS_PORT: ${{ job.services.redis.ports[6379] }}


  analytics-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatbot_analytics_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install "psycopg[binary]"
      - run: python -m unittest discover -s tests -p 'analytics_sql_integration.py' -v
        env:
          CHATBOT_ANALYTICS_SQL_TEST: '1'
          CHATBOT_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
