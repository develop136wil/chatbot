name: Manual Alert Email Test
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Send one test email to the configured SMTP sender (no automatic retries)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: manual-alert-email-test
  cancel-in-progress: false
jobs:
  send-once:
    if: inputs.confirm == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: One authorized SMTP self-test (never indexes content)
        env:
          CONFIRM_ALERT_EMAIL_TEST: send-once
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/test_alert_email.py
