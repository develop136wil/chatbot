<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>도봉구 영유아 복지정보자료집</title>
    <link rel="icon" href="/static/header-icon.png">

    <link rel="preload" href="/static/ONE Mobile POP.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/static/SF-Pro.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="stylesheet" href="/static/style.css?v=2026.09.21-analytics">

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="/static/ui-text.js?v=2026.09.21-analytics"></script>
    <script src="/static/script.js?v=2026.09.21-analytics" defer></script>

    <script>
        window.currentLang = 'ko'; 
    </script>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chatbot-tau-bay.vercel.app">
    <meta property="og:title" content="도봉구 영유아 복지정보자료집 👶">
    <meta property="og:description" content="도봉구 영유아 복지정보를 찾아보세요. 지원 조건과 자료 원문을 안내합니다.">
    <meta property="og:image" content="https://chatbot-tau-bay.vercel.app/static/og-image.png">

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="복지정보자료집">
    <link rel="apple-touch-icon" href="/static/header-icon.png">


</head>

<body>
    <div id="splash-screen" aria-hidden="true">
        <div class="splash-content">
            <img src="/static/header-icon.png" alt="" class="splash-logo">
            <h1 id="splash-title" class="splash-title">도봉구 영유아 복지정보자료집</h1>
        </div>
    </div>
    <div style="display: none;">
        <img src="/static/bot-icon.png" alt="">
        <img src="/static/toggle-icon.png" alt="">
    </div>

    <div class="chat-container" style="position: relative;">
        <div class="chat-topbar">
        <div class="chat-header">
            <h2>
                <img src="/static/header-icon.png" alt="icon" class="header-icon">
                <span id="header-title">도봉구 영유아 복지정보자료집</span>
            </h2>
        </div>

        <div class="lang-floating-container" role="group" aria-label="언어 선택">
            <button type="button" title="한국어" onclick="changeLanguage('ko')" id="btn-ko" class="lang-btn" aria-label="한국어" aria-pressed="true"><img class="language-flag" src="/static/flags/kr.svg" alt="" aria-hidden="true"></button>
            <button type="button" title="English" onclick="changeLanguage('en')" id="btn-en" class="lang-btn inactive" aria-label="English" aria-pressed="false"><img class="language-flag" src="/static/flags/us.svg" alt="" aria-hidden="true"></button>
            <button type="button" title="Tiếng Việt" onclick="changeLanguage('vi')" id="btn-vi" class="lang-btn inactive" aria-label="Tiếng Việt" aria-pressed="false"><img class="language-flag" src="/static/flags/vn.svg" alt="" aria-hidden="true"></button>
            <button type="button" title="中文" onclick="changeLanguage('zh')" id="btn-zh" class="lang-btn inactive" aria-label="中文（简体）" aria-pressed="false"><img class="language-flag" src="/static/flags/cn.svg" alt="" aria-hidden="true"></button>
        </div>
        <p id="language-note" class="language-note sr-only">선택한 언어는 다음 답변부터 적용돼요.</p>
        </div>
        <div id="language-live" class="sr-only" aria-live="polite"></div>

        <div class="chat-box" id="chat-box">
            <div class="message-row assistant">
                <img src="/static/bot-icon.png" class="bot-profile-icon" alt="bot">
                <div class="message assistant">
                    <p id="welcome-msg">도봉구 영유아 복지정보를 찾아드려요.<br><br>“24개월 아이가 받을 수 있는 지원”처럼 물어보세요.<br><br>필요한 경우 아이의 개월 수를 알려주세요. 이름이나 연락처는 입력하지 않아도 돼요.</p>

                    <div style="text-align: right; margin-top: 8px;">
                        <span id="time-notice" class="service-notice">관련 정보를 안내하며, 최종 지원 여부는 담당 기관에서 확인해 주세요.</span>
                    </div>
                    <div id="welcome-contact"></div>
                    <p id="analytics-notice" class="service-notice">서비스 개선을 위해 분야·언어·이용 결과 등의 통계를 수집할 수 있어요. 통계에는 질문 원문을 저장하지 않아요.</p>
                </div>
            </div>
        </div>

        <div class="suggestion-container" id="suggestion-container">
        </div>

        <button id="suggestion-toggle-btn" aria-label="추천 질문 토글">
            <span class="toggle-text">접기</span> <span class="toggle-icon"></span>
        </button>

        <button type="button" id="scroll-bottom-btn" aria-label="최신 답변으로 이동" title="최신 답변으로 이동">↓</button>

        <div class="chat-input-box">
            <textarea aria-label="복지정보 질문" id="user-input" placeholder="예: 24개월 아이가 받을 수 있는 지원" rows="1" autocomplete="off"></textarea>
            <button id="mic-btn" aria-label="음성 인식"></button>
            <button id="send-btn" aria-label="전송" style="display: none;"></button>
        </div>
    </div>

    <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

    <script>
        const translations = window.CHAT_UI_TEXT;

        function changeLanguage(lang) {
            if (window.isChatBusy && window.isChatBusy()) return;
            if (!['ko', 'en', 'vi', 'zh'].includes(lang)) return;
            window.currentLang = lang;
            try { localStorage.setItem('chatbot-language', lang); } catch (_) {}
            const data = translations[lang];

            const titleEl = document.getElementById('header-title');
            const welcomeEl = document.getElementById('welcome-msg');
            const timeEl = document.getElementById('time-notice');
            const inputEl = document.getElementById('user-input');

            if (titleEl) titleEl.innerText = data.title;
            const splashTitle = document.getElementById('splash-title');
            if (splashTitle) splashTitle.textContent = data.title;
            document.title = data.title;
            if (welcomeEl) welcomeEl.innerHTML = data.welcome;
            if (timeEl) timeEl.innerText = data.time;
            const analyticsNotice = document.getElementById('analytics-notice');
            if (analyticsNotice) analyticsNotice.textContent = data.analytics_notice;
            const contact = document.getElementById('welcome-contact');
            if (contact && typeof addContactActions === 'function') {
                contact.innerHTML = '';
                addContactActions(contact, lang);
            }
            if (inputEl) { inputEl.placeholder = data.placeholder; inputEl.setAttribute('aria-label', data.input_label); }
            if (typeof syncInputAvailability === 'function') syncInputAvailability();
            document.getElementById('mic-btn')?.setAttribute('aria-label', data.mic_label);
            document.getElementById('send-btn')?.setAttribute('aria-label', data.send_label);
            document.getElementById('suggestion-toggle-btn')?.setAttribute('aria-label', data.toggle_open);
            const bottom = document.getElementById('scroll-bottom-btn');
            if (bottom) {
                bottom.textContent = '↓';
                bottom.setAttribute('aria-label', data.scroll_bottom);
                bottom.setAttribute('title', data.scroll_bottom);
            }
            const selector = document.querySelector('.lang-floating-container');
            if (selector) selector.setAttribute('aria-label', data.language_label);
            const note = document.getElementById('language-note');
            if (note) note.textContent = data.language_note;
            document.documentElement.lang = ({ ko: 'ko', en: 'en', vi: 'vi', zh: 'zh-Hans' })[lang];
            const languageLive = document.getElementById('language-live');
            if (languageLive) languageLive.textContent = data.title;

            // [신규] 토글 버튼 텍스트 즉시 변경
            updateToggleText();

            const container = document.getElementById('suggestion-container');
            if (container) {
                container.innerHTML = '';
                data.chips.forEach(chip => {
                    const btn = document.createElement('button');
                    btn.className = 'suggestion-chip';
                    btn.innerText = chip.label;
                    btn.onclick = function () {
                        if (typeof sendSuggestion === 'function') {
                            sendSuggestion(chip.text);
                        }
                    };
                    container.appendChild(btn);
                });
            }

            // 스타일 변경 (베이지색 테두리)
            ['ko', 'en', 'vi', 'zh'].forEach(l => {
                const btn = document.getElementById('btn-' + l);
                if (btn) {
                    if (l === lang) {
                        btn.classList.remove('inactive');
                        btn.style.opacity = '1';
                        btn.style.filter = 'none';
                        btn.style.border = '2px solid #E5D1B8';
                        btn.style.boxShadow = '0 0 5px rgba(229, 209, 184, 0.5)';
                        btn.setAttribute('aria-pressed', 'true');
                    } else {
                        btn.classList.add('inactive');
                        btn.style.opacity = '0.5';
                        btn.style.filter = 'grayscale(100%)';
                        btn.style.border = '1px solid #eee';
                        btn.style.boxShadow = 'none';
                        btn.setAttribute('aria-pressed', 'false');
                    }
                }
            });
        }

        // [신규] 토글 버튼 상태에 따라 텍스트 번역해주는 함수
        function updateToggleText() {
            const container = document.getElementById('suggestion-container');
            const toggleTextSpan = document.querySelector('#suggestion-toggle-btn .toggle-text');
            const data = translations[window.currentLang];

            if (container && toggleTextSpan && data) {
                // script.js가 hidden 클래스를 넣었는지 확인
                if (container.classList.contains('hidden')) {
                    toggleTextSpan.textContent = data.toggle_open;  // "추천 질문"
                } else {
                    toggleTextSpan.textContent = data.toggle_close; // "접기"
                }
            }
        }

        window.onload = function () {
            let saved = 'ko';
            try { saved = localStorage.getItem('chatbot-language') || 'ko'; } catch (_) {}
            changeLanguage(['ko', 'en', 'vi', 'zh'].includes(saved) ? saved : 'ko');


        };
    </script>
</body>

</html>
